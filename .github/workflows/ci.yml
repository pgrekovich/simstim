name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    # The four gates every task must pass (see AGENTS.md). macos-latest is
    # arm64, matching the only supported target. Model-dependent tests skip
    # themselves when the real models aren't on disk, which on a runner is
    # always.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # A fallback Rust cache can contain sherpa's build-script output without
      # every static archive in its custom target directory. Refresh this small
      # native bundle so dependency changes cannot leave a partial cache.
      - name: Refresh sherpa-onnx native libraries
        run: |
          cargo clean -p sherpa-onnx-sys
          rm -rf target/sherpa-onnx-prebuilt

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: pnpm test
        working-directory: apps/desktop
        run: pnpm test

      - name: pnpm build
        working-directory: apps/desktop
        run: pnpm build
