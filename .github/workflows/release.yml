name: Release

# Tag-driven: pushing v0.2.0 builds and publishes that version. The tag is
# the single source of truth for the version -- it is injected into the
# bundle via a --config override, so nothing has to be edited in the repo to
# cut a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  SIGN_IDENTITY: "Developer ID Application: Pavel Hrakovich (7NMK8Z4NF4)"

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Release notes are derived from the commits since the previous
          # tag, so the whole history and every tag have to be present.
          fetch-depth: 0

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # A tag must pass the same four gates as a branch. The frontend build
      # runs below as Tauri's beforeBuildCommand before any artifact ships.
      - name: Test
        run: |
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          (cd apps/desktop && pnpm test)

      # An ephemeral keychain so the certificate never touches the runner's
      # login keychain. The runner is destroyed after the job either way.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Lets codesign use the key non-interactively; without this the
          # signing step hangs forever waiting for a permission dialog no
          # one can click on a headless runner.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm cert.p12
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Tauri signs with SIGN_IDENTITY (overriding the adhoc "-" used for
      # local builds) and, because APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID are
      # set, notarizes and staples the bundle itself.
      - name: Build the signed, notarized disk image
        working-directory: apps/desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python3 ../../scripts/release-config.py "$VERSION" /tmp/release-config.json \
            --signing-identity "$SIGN_IDENTITY"
          pnpm tauri build --config /tmp/release-config.json

      - name: Verify the shipped bundle
        run: |
          set -euo pipefail
          APP=target/release/bundle/macos/Simstim.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Authority lines only appear at -dvv; -dv prints none and the
          # grep would fail on a correctly signed build.
          codesign -dvv "$APP" 2>&1 | grep -q "Authority=$SIGN_IDENTITY"
          # Hardened runtime denies the microphone silently without this
          # entitlement (see docs/architecture.md); a
          # build without it ships a mic channel of digital silence.
          codesign -d --entitlements - "$APP" 2>&1 \
            | grep -q "com.apple.security.device.audio-input"
          xcrun stapler validate "$APP"
          # The end-to-end Gatekeeper verdict a user's Mac will reach.
          spctl --assess --type execute --verbose=2 "$APP" 2>&1 \
            | grep -q "source=Notarized Developer ID"

      - name: Assemble release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="target/release/bundle/dmg/Simstim_${VERSION}_aarch64.dmg"
          {
            scripts/release-notes.sh "$GITHUB_REF_NAME"
            printf '\n## Install\n\n'
            printf 'Open the disk image, drag simstim into Applications, launch it. Signed\n'
            printf 'with a Developer ID and notarized by Apple, so there is nothing to\n'
            printf 'bypass. ASR models download inside the app on first run\n'
            printf '(onboarding).\n\n'
            printf 'Optional AI: choose Connect Claude or Connect ChatGPT and finish browser sign-in.\n'
            printf 'Or use your own OpenAI, Anthropic or OpenRouter API key in Settings, with searchable model selection.\n'
            printf 'Keys stay in macOS Keychain; API usage is billed separately by your provider.\n'
            printf 'No terminal or Simstim account is required; AI setup can be skipped.\n\n'
            printf 'Requires macOS 14.2+ on Apple Silicon.\n\n'
            # shellcheck disable=SC2016 # literal markdown backticks, not expansion
            printf '%s\n\n```\n%s\n```\n' '`shasum -a 256`' \
              "$(cd "$(dirname "$DMG")" && shasum -a 256 "$(basename "$DMG")")"
          } > release-notes.md
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Positional arguments also handle an empty list on macOS Bash 3.
          set --
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            set -- --prerelease --latest=false
          fi
          gh release create "$GITHUB_REF_NAME" "$@" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "target/release/bundle/dmg/Simstim_${GITHUB_REF_NAME#v}_aarch64.dmg"
