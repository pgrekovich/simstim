[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = { workspace = true }
chrono = "0.4"
dirs = "6"
simstim-capture = { path = "../../../crates/capture" }
simstim-engine = { path = "../../../crates/engine" }
simstim-transcript = { path = "../../../crates/transcript" }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
tokio = { version = "1", default-features = false, features = ["fs", "io-util"] }
futures-util = "0.3"
tar = "0.4"
bzip2 = "0.4"
hound = "3"
flacenc = "0.5"

[dev-dependencies]
tempfile = "3"
claxon = "0.4"

