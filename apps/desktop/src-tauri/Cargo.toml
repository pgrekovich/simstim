[package]
name = "desktop"
version = "0.1.0"
description = "Local call transcription to Markdown, with your own AI tools"
license = "MIT"
repository = "https://github.com/pgrekovich/simstim"
authors = ["Pavel Hrakovich"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the only way to get a transparent webview window on
# macOS (the banner window is a transparent layer around a rounded card).
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
toml = "1.1"
anyhow = { workspace = true }
chrono = "0.4"
dirs = "7"
simstim-capture = { path = "../../../crates/capture" }
simstim-engine = { path = "../../../crates/engine" }
simstim-transcript = { path = "../../../crates/transcript" }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
# "sync": retranscribe's FIFO queue uses a `tokio::sync::oneshot`
# per queued job so a `retranscribe_session` call that gets queued behind
# another one can still await its OWN job's result once its turn comes,
# instead of resolving before the job actually ran.
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "sync"] }
# Session deletion moves files to the macOS Trash instead of unlinking them:
# a mis-click must stay recoverable (the user's words are sacred).
trash = "5"
futures-util = "0.3"
hound = "3"
flacenc = "0.5"
claxon = "0.4"
# Process-group kill in aac::run_with_timeout: killing only the direct child
# leaves forked helpers holding our stdout/stderr pipes, which silently
# defeats the watchdog (observed: a 200ms timeout blocking for the full 30s
# of a grandchild's sleep).
libc = "0.2"
# Used at runtime for AAC conversion and recovery:
# decoding a `.m4a` (re-transcribe, continuation prefill) shells out to
# `afconvert` into a scratch WAV first (see `aac.rs`), which needs a real
# temp file, not just a path string -- `tempfile::NamedTempFile`'s `Drop`
# cleans it up even on an early return/panic, which a hand-rolled
# `std::env::temp_dir()` + manual removal would not.
tempfile = "3"
[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.29", default-features = false, features = ["app", "at", "blocks", "core_audio", "dispatch", "macos_14_2"] }
# AppKit must receive the titlebar frame as one atomic setFrame call. Updating
# its size and origin separately lets the autoresizing mask cancel the
# vertical traffic-light inset.
objc = "0.2"
# Converts the banner window into a non-activating NSPanel so clicking its
# buttons never steals focus from the call app, and the panel can float over
# full-screen apps (fullScreenAuxiliary). Not on crates.io; pinned to a rev
# of the v2 branch (the v2.1 branch is a different PanelBuilder API).
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "18ffb9a201fbf6fedfaa382fd4b92315ea30ab1a" }

[dev-dependencies]
# Adds `tauri::test::mock_app()` (Cargo's feature unification only pulls
# this extra "test" feature in for test/bench/example builds of this crate,
# never for the normal lib/bin -- the same single `tauri` dependency
# instance still also carries `protocol-asset` from [dependencies] above
# during `cargo test`, which is what makes `mock_app().asset_protocol_scope()`
# usable in `lib.rs`'s tests).
tauri = { version = "2", features = ["test"] }
