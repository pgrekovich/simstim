name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    # The four gates every task must pass (see AGENTS.md). macos-latest is
    # arm64, matching the only supported target. Model-dependent tests skip
    # themselves when the real models aren't on disk, which on a runner is
    # always.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: pnpm test
        working-directory: apps/desktop
        run: pnpm test

      - name: pnpm build
        working-directory: apps/desktop
        run: pnpm build
