name: Site

# Builds simstim.tech and deploys it to Cloudflare Workers as static assets. Runs on changes to
# the site itself and after every stable release (see release.yml), so the
# download link follows the latest version without a manual step.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://simstim.tech

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The build reads the latest release through the API. The workflow token
      # can read releases of a private repository.
      - name: Build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node build.mjs

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
          # site/ has a pnpm lockfile for the screenshot script's sharp, but
          # the runner has no pnpm; wrangler itself needs no dependencies.
          packageManager: npm
