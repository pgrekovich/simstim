name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    # The four gates every task must pass (see AGENTS.md). macos-latest is
    # arm64, matching the only supported target. Model-dependent tests skip
    # themselves when the real models aren't on disk, which on a runner is
    # always.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      # A fallback Rust cache can contain sherpa's build-script output without
      # every static archive in its custom target directory. Refresh this small
      # native bundle so dependency changes cannot leave a partial cache.
      - name: Refresh sherpa-onnx native libraries
        run: |
          cargo clean -p sherpa-onnx-sys
          rm -rf target/sherpa-onnx-prebuilt

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: pnpm test
        working-directory: apps/desktop
        run: pnpm test

      - name: pnpm build
        working-directory: apps/desktop
        run: pnpm build
